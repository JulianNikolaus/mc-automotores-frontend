<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M&C Automotores | Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#D4AF37', base: '#10131A', lowest: '#0B0E14', card: '#191C22', cardalt: '#1C2027', hover: '#363940', ink: '#F1F5F9', muted: '#94A3B8' },
          fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
        },
      },
    };
  </script>
</head>

<body class="bg-base text-muted font-sans antialiased min-h-screen">

  <!-- LOGIN -->
  <section id="loginView" class="min-h-screen flex items-center justify-center px-4">
    <form id="loginForm" class="w-full max-w-sm bg-card border border-primary/15 rounded-3xl p-8">
      <h1 class="font-display text-2xl text-ink text-center">M&C <span class="text-primary">Admin</span></h1>
      <p class="text-center text-sm mt-1">Acceso restringido</p>
      <div class="mt-8 space-y-4">
        <input id="lEmail" type="email" required placeholder="Email"
          class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none focus:ring-1 focus:ring-primary" />
        <input id="lPass" type="password" required placeholder="Contraseña"
          class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none focus:ring-1 focus:ring-primary" />
        <button
          class="w-full bg-primary text-lowest font-semibold rounded-xl py-3 hover:brightness-110 transition">Ingresar</button>
        <p id="lErr" class="hidden text-red-400 text-sm text-center"></p>
      </div>
    </form>
  </section>

  <!-- PANEL -->
  <section id="adminView" class="hidden">
    <header class="sticky top-0 backdrop-blur-md bg-base/70 border-b border-primary/15">
      <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-4">
        <h1 class="font-display text-xl text-ink">Panel <span class="text-primary">Admin</span></h1>
        <button id="logoutBtn" class="text-sm hover:text-primary transition">Salir</button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 grid gap-10 lg:grid-cols-3">
      <!-- Formulario -->
      <form id="vehicleForm" class="bg-card border border-primary/15 rounded-3xl p-6 space-y-4 h-fit">
        <h2 class="font-display text-xl text-ink" id="formTitle">Nuevo vehículo</h2>
        <input type="hidden" id="vId" />
        <input id="vBrand" required placeholder="Marca"
          class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
        <input id="vModel" required placeholder="Modelo"
          class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
        <div class="grid grid-cols-2 gap-3">
          <input id="vYear" type="number" required placeholder="Año"
            class="bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
          <input id="vKm" type="number" required placeholder="Km"
            class="bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
        </div>
        <div class="flex gap-3">
          <select id="vCurrency" class="bg-cardalt rounded-xl px-3 py-3 text-sm text-ink outline-none w-32">
            <option value="USD">USD</option>
            <option value="ARS">ARS</option>
          </select>
          <input id="vPrice" type="number" required placeholder="Precio"
            class="flex-1 bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
        </div>
        <textarea id="vDescription" rows="3" placeholder="Descripción / observaciones"
          class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none"></textarea>
        <select id="vStatus" class="w-full bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none">
          <option value="available">Disponible</option>
          <option value="reserved">Reservado</option>
          <option value="sold">Vendido</option>
        </select>
        <div class="grid grid-cols-3 gap-2">
          <input id="vMotor" placeholder="Motor"
            class="bg-cardalt rounded-xl px-3 py-3 text-xs text-ink outline-none" />
          <input id="vTrans" placeholder="Transmisión"
            class="bg-cardalt rounded-xl px-3 py-3 text-xs text-ink outline-none" />
          <input id="vTrac" placeholder="Tracción"
            class="bg-cardalt rounded-xl px-3 py-3 text-xs text-ink outline-none" />
        </div>
        <div class="grid grid-cols-3 gap-3">
          <input id="vInstPrice" type="number" placeholder="Valor cuota"
            class="bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
          <input id="vInstNum" type="number" placeholder="N° cuotas" value="12"
            class="bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
          <input id="vDownPayment" type="number" placeholder="Anticipo"
            class="bg-cardalt rounded-xl px-4 py-3 text-sm text-ink outline-none" />
        </div>
        <input id="vImages" type="file" accept="image/*" multiple class="text-sm hidden" />
        <label for="vImages"
          class="inline-flex items-center gap-2 cursor-pointer border border-primary/40 text-primary rounded-xl px-4 py-2 text-sm hover:bg-primary hover:text-lowest transition-all duration-300">
          <span class="material-symbols-outlined text-base">add_photo_alternate</span> Agregar fotos
        </label>
        <div id="existingImages" class="flex gap-2 flex-wrap mt-3"></div>
        <button
          class="w-full bg-primary text-lowest font-semibold rounded-xl py-3 hover:brightness-110 transition">Guardar</button>
        <button type="button" id="cancelEdit" class="hidden w-full text-sm hover:text-primary transition">Cancelar
          edición</button>
      </form>

      <!-- Lista -->
      <div class="lg:col-span-2">
        <h2 class="font-display text-xl text-ink mb-4">Inventario</h2>
        <div id="vehicleList" class="space-y-3"></div>
      </div>
    </main>
  </section>

  <script>
    const API = 'http://localhost:4000/api/v1';
    const token = localStorage.getItem('mc_token');
    const imgUrl = (src) => !src ? 'https://placehold.co/100/191C22/D4AF37?text=M%26C' : src.startsWith('/uploads') ? `http://localhost:4000${src}` : src;

    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');

    function showAdmin() { loginView.classList.add('hidden'); adminView.classList.remove('hidden'); loadVehicles(); }

    if (token) showAdmin();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: lEmail.value, password: lPass.value }),
      });
      if (!res.ok) { lErr.textContent = 'Credenciales inválidas'; lErr.classList.remove('hidden'); return; }
      const data = await res.json();
      localStorage.setItem('mc_token', data.token);
      showAdmin();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('mc_token');
      location.reload();
    });

    async function loadVehicles() {
      const res = await fetch(`${API}/vehicles`);
      const vehicles = await res.json();
      document.getElementById('vehicleList').innerHTML = vehicles.map((v) => `
        <div class="bg-card border border-primary/15 rounded-2xl p-4 flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <img src="${imgUrl(v.images?.[0])}" class="w-16 h-16 object-cover rounded-xl border border-primary/15" onerror="this.src='https://placehold.co/100/191C22/D4AF37?text=M%26C'" />
            <div>
              <p class="text-ink font-semibold">${v.brand} ${v.model} <span class="text-xs text-primary ml-2">${v.status}</span></p>
              <p class="text-xs">${v.year} · ${Number(v.kilometers).toLocaleString('es-AR')} km · ${v.priceCurrency === 'ARS' ? '$' : 'USD'} ${Number(v.price).toLocaleString('es-AR')}</p>
            </div>
          </div>
          <div class="flex gap-2 text-sm">
            <button onclick="editVehicle('${v._id}')" class="px-3 py-1.5 border border-primary/40 text-primary rounded-lg">Editar</button>
            <button onclick="deleteVehicle('${v._id}')" class="px-3 py-1.5 border border-red-500/40 text-red-400 rounded-lg">Eliminar</button>
          </div>
        </div>`).join('') || '<p class="text-sm">Sin vehículos cargados.</p>';
    }

    let imageOrder = []; // {kind:'existing', src} | {kind:'pending', file}

    function renderExistingImages() {
      const el = document.getElementById('existingImages');
      el.innerHTML = imageOrder.length
        ? imageOrder.map((item, i) => `
          <div draggable="true" data-i="${i}" class="relative cursor-move rounded-lg ${item.kind === 'pending' ? 'ring-1 ring-primary' : ''}">
            <img src="${item.kind === 'existing' ? imgUrl(item.src) : URL.createObjectURL(item.file)}" class="w-20 h-20 object-cover rounded-lg border border-primary/20" onerror="this.style.display='none'" />
            <button type="button" onclick="removeImage(${i})" title="Quitar foto"
              class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-lowest border border-red-400/60 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition-colors duration-200 shadow-lg">
              <span class="material-symbols-outlined text-sm leading-none">close</span>
            </button>
          </div>`).join('')
        : '<p class="text-xs">Sin fotos cargadas.</p>';
      el.querySelectorAll('[draggable]').forEach((item) => {
        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', item.dataset.i);
          item.classList.add('opacity-40');
        });
        item.addEventListener('dragend', () => item.classList.remove('opacity-40'));
        item.addEventListener('dragover', (e) => e.preventDefault());
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const from = Number(e.dataTransfer.getData('text/plain'));
          const to = Number(item.dataset.i);
          const [moved] = imageOrder.splice(from, 1);
          imageOrder.splice(to, 0, moved);
          renderExistingImages();
        });
      });
    }

    function removeImage(i) {
      imageOrder.splice(i, 1);
      renderExistingImages();
    }

    function removeExistingImage(i) { removeImage(i); }
    function removePendingFile(i) { removeImage(i); }

    document.getElementById('vImages').addEventListener('change', (e) => {
      [...e.target.files].forEach((f) => imageOrder.push({ kind: 'pending', file: f }));
      e.target.value = '';
      renderExistingImages();
    });

    async function editVehicle(id) {
      const v = await (await fetch(`${API}/vehicles/${id}`)).json();
      vId.value = v._id; vBrand.value = v.brand; vModel.value = v.model;
      vYear.value = v.year; vKm.value = v.kilometers; vPrice.value = v.price; vStatus.value = v.status;
      vCurrency.value = v.priceCurrency || 'USD'; vDescription.value = v.description || '';
      vMotor.value = v.technicalSpecs?.motor || ''; vTrans.value = v.technicalSpecs?.transmision || ''; vTrac.value = v.technicalSpecs?.traccion || '';
      vInstPrice.value = v.installmentPrice || ''; vInstNum.value = v.installments || 12; vDownPayment.value = v.downPayment || '';
      imageOrder = (v.images || []).map((src) => ({ kind: 'existing', src }));
      renderExistingImages();
      document.getElementById('formTitle').textContent = 'Editar vehículo';
      cancelEdit.classList.remove('hidden');
    }

    cancelEdit.addEventListener('click', () => {
      vehicleForm.reset(); vId.value = '';
      imageOrder = [];
      renderExistingImages();
      document.getElementById('formTitle').textContent = 'Nuevo vehículo';
      cancelEdit.classList.add('hidden');
    });

    document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('brand', vBrand.value); fd.append('model', vModel.value);
      fd.append('year', vYear.value); fd.append('kilometers', vKm.value);
      fd.append('price', vPrice.value); fd.append('status', vStatus.value);
      fd.append('priceCurrency', vCurrency.value); fd.append('description', vDescription.value);
      fd.append('technicalSpecs', JSON.stringify({ motor: vMotor.value, transmision: vTrans.value, traccion: vTrac.value }));
      fd.append('installmentPrice', vInstPrice.value); fd.append('installments', vInstNum.value);
      fd.append('downPayment', vDownPayment.value);
      fd.append('keepImages', JSON.stringify(imageOrder.filter((i) => i.kind === 'existing').map((i) => i.src)));
      imageOrder.filter((i) => i.kind === 'pending').forEach((i) => fd.append('images', i.file));

      const id = vId.value;
      await fetch(id ? `${API}/vehicles/${id}` : `${API}/vehicles`, {
        method: id ? 'PUT' : 'POST',
        headers: { Authorization: `Bearer ${localStorage.getItem('mc_token')}` },
        body: fd,
      });
      vehicleForm.reset(); vId.value = '';
      imageOrder = [];
      renderExistingImages();
      document.getElementById('formTitle').textContent = 'Nuevo vehículo';
      cancelEdit.classList.add('hidden');
      loadVehicles();
    });

    async function deleteVehicle(id) {
      if (!confirm('¿Eliminar este vehículo?')) return;
      await fetch(`${API}/vehicles/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${localStorage.getItem('mc_token')}` },
      });
      loadVehicles();
    }
  </script>
</body>

</html>
